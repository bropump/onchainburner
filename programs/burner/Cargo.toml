# Standalone workspace: this crate builds on its own with a pinned
# dependency set, which is what makes the artifact byte-reproducible.
[workspace]
resolver = "2"

# `solana-verify` uses this to select the digest-pinned Agave 4.0.0 build
# image. The deploy script additionally passes SBPFv3 and platform-tools v1.53.
[workspace.metadata.cli]
solana = "4.0.0"

[package]
name = "pinocchio-parity"
version = "0.1.0"
edition = "2021"
publish = false
description = "The production Pinocchio burner program: swap_and_burn and swap_and_burn_split."

[lib]
crate-type = ["cdylib", "lib"]
name = "pinocchio_parity"

[features]
default = ["bpf-entrypoint"]
bpf-entrypoint = []
# The keyless design is now the ONLY design. The `keyless`, `directcurve` and
# `mainnet` feature gates were removed along with the KMS quote-authority path:
# the on-chain reference-bound floor replaces the off-chain signature, so there
# is no quote authority to pin and no second variant to gate.

[dependencies]
pinocchio = { version = "=0.11.2", default-features = false, features = ["alloc", "cpi"] }
# Use the audited Token-2022 TLV decoder rather than hand-rolled extension
# parsing.
spl-token-2022 = { version = "6.0.0", default-features = false, features = ["no-entrypoint", "zk-ops"] }

# For host-side tests. `Address::find_program_address` is a syscall on
# `target_os = "solana"` but needs the curve25519 fallback off-chain.
# Dev-dependency features are not unified into the `cargo build-sbf` lib build
# under resolver 2, so this does not change the deployed artifact. The host
# unit tests (`npm run test:unit`, `#[cfg(test)]` modules in src/) rely on it.
[dev-dependencies]
solana-address = { version = "=2.6.1", features = ["curve25519"] }
# Runs the deployed SBPF artifact under a deliberately malicious replacement
# for the pinned Jupiter program.  This is a host-only dependency: it is never
# unified into the SBF program build under resolver 2.
## These exact companion versions are the Anza Mollusk v0.14.0 release lock,
## deliberately pinned to avoid semver-skew in Agave's wincode types.
mollusk-svm = { version = "=0.14.0", features = ["inner-instructions"] }
# Host-side property fuzzing (`mod fuzz` in src/, `npm run fuzz`). Test-only:
# resolver 2 keeps dev-dependencies out of the `cargo build-sbf` lib build, so
# the deployed artifact is byte-identical with or without it.
proptest = "1.7.0"
mollusk-svm-programs-token = { version = "=0.14.0", default-features = false, features = ["token"] }
solana-account = "=4.3.1"
solana-fee-calculator = "=3.2.2"
solana-hash = "=4.4.0"
solana-instruction = "=3.4.0"
solana-instruction-error = "=2.3.0"
solana-message = "=4.2.3"
solana-nonce = "=3.2.0"
solana-nonce-account = "=4.1.0"
solana-program-option = "=3.1.0"
solana-pubkey = "=4.2.0"
solana-rent = "=4.3.0"
solana-reward-info = "=6.2.0"
solana-signature = "=3.4.1"
solana-signer = "=3.0.0"
solana-short-vec = "=3.2.2"
solana-system-interface = "=3.2.0"
solana-transaction = "=4.1.2"
solana-transaction-error = "=3.3.0"
spl-token-interface = "=2.0.0"
wincode = "=0.6.1"

# Mirrors the production workspace release profile so the size comparison is
# like-for-like.
[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
